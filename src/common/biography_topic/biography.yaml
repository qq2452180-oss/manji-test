# 通用人生传记模板 V1：8 个章节，每章 5 个核心内容片段，共 40 项。
# core_contents 表示可逐步积累的内容方向；同一段讲述可以涉及多项，一项也可积累多篇故事。
# 描述中的内容供自然选取和展开，无须逐条问完；已讲过的材料可直接复用。
# 各项只在用户真实经历和表达意愿范围内使用，不适用的内容可以跳过、修改或删除。
# boundary 说明章节的叙述侧重；访谈中正常承接跨章内容，最终按真实内容归章。

template_id: general_biography
version: 1
name: 通用人生传记

chapters:
  - id: origins
    title: 我的来处
    purpose: >-
      交代出生与早年的家庭和生活环境，
      让读者了解这段人生从怎样的生活背景开始。

    core_contents:
      - id: hometown
        title: 家乡与居住环境
        description: >-
          出生或早年生活的大致年代、主要居住的地方，
          以及能体现当时生活样貌的居住环境。

      - id: early_household
        title: 早年一起生活的人
        description: >-
          早年主要和谁共同生活，彼此的关系，
          以及记忆中与这些人相处的样子。

      - id: family_livelihood
        title: 家里怎样维持生活
        description: >-
          当时家人主要依靠什么工作、劳动或营生过日子，
          以及家庭生活的大致条件。

      - id: household_ways
        title: 家里的习惯与规矩
        description: >-
          家中吃饭、待人或处理事情时的一些习惯与规矩，
          以及自己记得的具体表现。

      - id: neighborhood
        title: 街坊邻里与周围的人
        description: >-
          早年常来往的邻居、亲友或周围人家，
          以及彼此平时往来、相处的情形。

    boundary: >-
      本章侧重早年的家庭与生活背景。
      具体童年往事和成年后的家庭经历，可按实际内容在合适的章节展开。

  - id: childhood
    title: 童年时光
    purpose: >-
      通过童年的日常活动和具体往事，
      呈现小时候怎样生活、玩耍和认识周围的世界。

    core_contents:
      - id: childhood_day
        title: 小时候平常的一天
        description: >-
          童年某个熟悉阶段里，平常一天大致怎样度过，
          以及那时经常做的事情和常去的地方。

      - id: playmates_and_play
        title: 玩伴与常玩的事情
        description: >-
          小时候常一起玩的伙伴、喜欢的玩法或活动，
          以及一起玩耍时记得的一段经历。

      - id: childhood_chores
        title: 做过的家务与劳动
        description: >-
          小时候帮家里做过的事情，
          从一次记得的家务或劳动经历，写出当时怎样参与其中。

      - id: childhood_occasions
        title: 过节和出门的经历
        description: >-
          童年过节、赶集、走亲戚或外出时记得的一次经历，
          留下那天发生的事情，以及当时一起的人。

      - id: childhood_memory
        title: 记得的一件童年小事
        description: >-
          一件到现在仍记得、愿意讲述的童年小事，
          可以是一次尝试、一个小插曲，或与某个人相处的一段经历。

    boundary: >-
      本章侧重童年的日常活动和具体经历。
      家庭构成、居住条件等背景可以自然带出，已经讲清楚的内容沿用已有记录。

  - id: adolescence
    title: 少年与成长
    purpose: >-
      记录逐渐长大时的学习、交往、兴趣和责任，
      呈现少年时期的自己，以及生活怎样走向下一阶段。

    core_contents:
      - id: learning_experience
        title: 读书、学艺与学习本领
        description: >-
          少年时期上学、学艺或跟着身边的人学习本领的实际经历，
          以及那段日子里记得的人和事。

      - id: adolescent_responsibilities
        title: 少年时开始承担的事情
        description: >-
          随着长大，开始分担或独自处理的家务、劳动与生活事务，
          以及一件能够体现当时责任变化的经历。

      - id: adolescent_companions
        title: 那时的老师、同伴与熟人
        description: >-
          少年时期经常相处或留下印象的人，
          以及一起学习、做事或互相帮助的一段经历。

      - id: adolescent_interests
        title: 那时喜欢投入的事情
        description: >-
          少年时期喜欢做、愿意花时间做的一件事，
          以及自己当时怎样接触、参与或尝试。

      - id: next_life_step
        title: 走向下一段生活的经过
        description: >-
          少年时期的生活后来在什么情况下发生变化，
          以及自己走向继续学习、劳动或其他生活安排的经过。

    boundary: >-
      本章侧重成长过程，以及走向下一阶段的过渡。
      开始承担主要生活责任后的实际经历，按生活变化和叙述重心归章，
      章节分工不以固定年龄或是否读过书为前提。

  - id: entering_society
    title: 走向社会
    purpose: >-
      记录开始承担主要生活责任时的经历，
      呈现刚起步时怎样学着做事、与人相处和安排生活。

    core_contents:
      - id: first_work
        title: 最早做过的工作或劳动
        description: >-
          最早持续承担的工作、生产劳动、经营或家中主要事务，
          交代当时主要做什么，以及怎样开始。

      - id: learning_the_work
        title: 刚开始时怎样学着做
        description: >-
          刚开始做事时怎样摸索、学习和适应，
          以及一次能够体现这个过程的实际经历。

      - id: early_living_arrangements
        title: 刚起步时怎样过日子
        description: >-
          那时住在哪里，平时怎样安排吃住、开销和日常事务，
          以及与原来生活相比发生的实际变化。

      - id: early_connections
        title: 起步时遇到的人
        description: >-
          刚起步时常打交道的同事、师傅、邻里或其他人，
          以及一次一起做事、获得帮助或建立来往的经历。

      - id: early_responsibility
        title: 开始自己拿主意的事情
        description: >-
          起步阶段开始自己决定或张罗的一件事情，
          记录当时怎样安排和处理，以及事情后来怎样。

    boundary: >-
      本章侧重最初起步和适应生活的阶段，包含在原居住地承担劳动或家中主要事务的经历。
      此后长期从事的工作、生活安排的变化和积累的本领，可在相关章节继续展开。

  - id: livelihood
    title: 谋生与奋斗
    purpose: >-
      梳理较长时间里主要做过的工作、劳动和照料事务，
      通过日常、变化与具体经历，写出自己怎样承担生活、逐渐积累经验。

    core_contents:
      - id: main_work
        title: 长期做过的工作与劳动
        description: >-
          较长时间从事过的工作、生产劳动、经营或家务照料，
          交代大致先后、持续的阶段，以及它们在自己生活中的位置。

      - id: workday_routine
        title: 一段熟悉的做事日常
        description: >-
          从一段熟悉的日子讲起，记录平时主要忙些什么、怎样做事，
          以及当时一起做事的人和生活节奏。

      - id: work_changes
        title: 工作与生活安排的变化
        description: >-
          多年里主要事务和生活安排怎样延续或调整；
          有换工作、转行、经营或照料重心变化时，记录大致先后和实际缘由。

      - id: representative_work
        title: 一件有代表性的做事经历
        description: >-
          从长期做过的事情中，选取一件自己记得清楚的经历，
          记录当时面对的事情、实际做法和后来结果，普通的小事也可以。

      - id: learned_methods
        title: 积累的本领与做事方法
        description: >-
          在长期实践中逐渐掌握的手艺、方法或处理事情的能力，
          以及它怎样学来、在什么具体事情中用到。

    boundary: >-
      本章侧重持续多年的主要事务与做事经历，起步经过作必要承接。
      牵动整体生活方向的变化，可按叙述重心集中整理，已讲清楚的经过直接复用。

  - id: family_and_relationships
    title: 家庭与重要关系
    purpose: >-
      记录成年后的重要关系和共同生活经历，
      呈现自己与他人怎样相伴、往来、分担和照料。

    core_contents:
      - id: important_people
        title: 长期相伴的重要人物
        description: >-
          成年后长期相伴或保持联系的家人、伴侣、朋友，
          以及一段能说明彼此关系怎样形成或延续的真实经历。

      - id: shared_daily_life
        title: 一起生活或相处的日常
        description: >-
          与重要的人共同生活或经常往来的一段日子，
          以及彼此熟悉的相处方式和日常习惯。

      - id: care_and_responsibility
        title: 生活中的分担与照料
        description: >-
          日常生活中分担家事、养育子女、照顾长辈等实际经历，
          也包括自己得到照顾和支持的经历，记录彼此怎样安排这些事情。

      - id: shared_experience
        title: 一次一起经历的事情
        description: >-
          一件共同商量、完成或相互支持的事情，
          记录当时发生了什么，以及彼此实际做过什么。

      - id: relationship_changes
        title: 这些年相处方式的变化
        description: >-
          这些年彼此怎样保持联系和相处；
          有分开居住、生活重心调整等变化时，记录相处方式怎样随之变化。

    boundary: >-
      本章侧重成年后的重要关系与共同生活，适用人物和经历以用户实际情况为准。
      同一件事涉及长期劳动时，可分别保留关系和劳动方面的重点，完整经过按主要内容归章。

  - id: turning_points
    title: 人生中的重要转折
    purpose: >-
      记录对后来生活产生明显影响的变化，
      通过当时的处境、实际经过与后续生活，连接人生中的不同阶段。

    core_contents:
      - id: life_before_change
        title: 变化之前的生活
        description: >-
          在这段变化发生前，自己主要过着怎样的日子，
          当时的工作、居住或家庭安排是什么样。

      - id: beginning_of_change
        title: 变化怎样开始
        description: >-
          哪些实际事情让原有生活开始改变，或一段变化最初怎样显现，
          从自己记得的起点展开，也包括逐渐发生的变化。

      - id: circumstances_and_response
        title: 当时的处境与安排
        description: >-
          当时面对的现实条件、能够选择或需要接受的安排，
          以及自己怎样回应，相关人物在其中实际起了什么作用。

      - id: living_through_change
        title: 经历变化的过程
        description: >-
          从原来的生活走到后来生活的具体经过，
          包括实际做过的事情，以及适应新情况时记得的经历。

      - id: life_after_change
        title: 后来生活有什么不同
        description: >-
          变化之后，日常生活、承担的事情或重要关系有哪些具体不同，
          以及这些不同怎样体现在后来的一段生活中。

    boundary: >-
      本章的五项可以围绕同一段真实变化展开；有多段变化时，分别保持前后对应。
      已在其他章节讲清楚的经过直接复用，按叙述重心决定最终归属。
      没有适用经历时，可调整或省略本章。

  - id: life_today
    title: 走过的岁月
    purpose: >-
      将人生叙述接到目前或最近一段生活，
      记录现在的日常、喜好与牵挂，并留下自己愿意表达的话。

    core_contents:
      - id: recent_life
        title: 近些年的生活安排
        description: >-
          最近一段时间的生活重心，以及居住、工作或家庭安排怎样延续或调整，
          交代目前这一阶段的生活怎样形成。

      - id: present_day
        title: 现在平常的一天
        description: >-
          目前一个普通日子里主要做些什么、常去哪里、与谁来往，
          呈现现在生活的基本样貌。

      - id: present_interests
        title: 现在喜欢做的事情
        description: >-
          现在喜欢或愿意花时间做的一件事，
          以及它怎样出现在自己的日常生活中。

      - id: present_concerns
        title: 现在放在心上的人和事
        description: >-
          目前常常关心、惦记或愿意投入时间的人和事，
          以及与之相关的一段真实日常。

      - id: words_to_keep
        title: 回头看，想留下的话
        description: >-
          结合已经讲过的经历，记录自己愿意对亲友、读者或未来的自己说的话；
          也可以讲接下来想过怎样的日子，朴素的一句话同样可以保留。

    boundary: >-
      本章侧重最近阶段、当下生活和本人愿意表达的回望，适用于不同年龄和生活状态。
      早年故事作简短呼应，具体经历沿用已有记录；未来内容按愿望或计划表达。